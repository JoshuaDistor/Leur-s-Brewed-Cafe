<!DOCTYPE html>
<html lang="en"><head>
<title>Create account - Leur's Brewed Cafe</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b271c">
<link rel="icon" type="image/jpeg" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<main class="auth-wrap"><div class="container auth-container">
  <div class="row g-4 align-items-stretch">
    <div class="col-lg-4"><div class="auth-brand">
      <img src="img/logo.jpg" alt="Leur's cafe logo">
      <div class="auth-brand-text">
        <h2 class="serif">Stay Fresh and take a Rest</h2>
        <div class="sub">Coffee Break</div>
      </div>
    </div></div>
    <div class="col-lg-8"><div class="cafe-card auth-panel">
      <h1>Create your account</h1>
      <form id="form" novalidate>
        <div class="mb-3"><label class="form-label cafe" for="username">Username</label>
          <input class="form-control" id="username" autocomplete="username" aria-describedby="usernameHelp">
          <div class="form-text" id="usernameHelp">At least 2 characters. You can sign in with this username or your email.</div></div>
        <div class="mb-3"><label class="form-label cafe" for="email">Email address</label><input class="form-control" id="email" type="email" autocomplete="email"></div>
        <div class="mb-3"><label class="form-label cafe" for="password">Password</label><input class="form-control" id="password" type="password" autocomplete="new-password"></div>
        <div class="mb-4"><label class="form-label cafe" for="confirm">Confirm password</label><input class="form-control" id="confirm" type="password" autocomplete="new-password"></div>
        <div id="error" class="alert alert-danger py-2 small d-none" role="alert"></div>
        <button class="btn btn-caramel w-100" id="submit" type="submit">CREATE ACCOUNT</button>
        <p class="text-center small mt-3 text-secondary mb-0">Already have an account? <a href="login.html">Sign in</a></p>
      </form>
    </div></div>
  </div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
const el = (id) => document.getElementById(id);
el('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = el('error'); err.classList.add('d-none'); el('submit').disabled = true;
  try {
    await API.post('/api/register', { username: el('username').value, email: el('email').value, password: el('password').value, confirm: el('confirm').value });
    location.href = 'menu.html';
  } catch (ex) { err.textContent = ex.message; err.classList.remove('d-none'); el('submit').disabled = false; }
});
</script>
</body></html>
