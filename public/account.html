<!DOCTYPE html>
<html lang="en"><head>
<title>Your account - Leur's Brewed Cafe</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b271c">
<link rel="icon" type="image/jpeg" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<div class="page"><header class="topbar" id="topbar"></header>
  <section class="cafe-card account-card text-center">
    <div class="avatar big-avatar mx-auto mb-2" id="bigAvatar">C</div>
    <div class="fw-bold mb-4" id="email"></div>
    <form id="form" class="text-start" novalidate>
      <div class="row g-3 mb-4">
        <div class="col-sm-6"><label class="form-label cafe" for="username">Username</label><input class="form-control" id="username"></div>
        <div class="col-sm-6"><label class="form-label cafe" for="password">New password</label><input class="form-control" id="password" type="password" autocomplete="new-password" placeholder="Leave blank to keep"></div>
      </div>
      <button class="btn btn-caramel w-100 mb-2" type="submit">SAVE CHANGES</button>
      <button class="btn btn-outline-cafe w-100" type="button" data-bs-toggle="modal" data-bs-target="#delModal">DELETE ACCOUNT</button>
    </form>
  </section>
</div>
<div class="modal fade" id="delModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content cafe-card">
  <div class="modal-body p-4"><h3 class="h5">Delete your account?</h3><p class="text-secondary small">This permanently removes your account. This can't be undone.</p>
    <div class="d-flex gap-2 justify-content-end"><button class="btn btn-tan" data-bs-dismiss="modal">Keep account</button><button class="btn btn-danger" id="delBtn">Delete</button></div></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
(async () => {
  const u = await requireUser(); if (!u) return;
  if (u.role === 'admin') { location.href = 'admin.html'; return; }
  renderCustomerNav('Your account', '', u);
  $('email').textContent = u.email; $('username').value = u.username; $('bigAvatar').textContent = u.username.charAt(0).toUpperCase();
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { const r = await API.post('/api/me', { username: $('username').value, password: $('password').value }); $('password').value = ''; toast('Changes saved.'); renderCustomerNav('Your account', '', r); }
    catch (ex) { toast(ex.message, true); }
  });
  $('delBtn').addEventListener('click', async () => { try { await API.del('/api/me'); location.href = 'register.html'; } catch (ex) { toast(ex.message, true); } });
})();
</script>
</body></html>
