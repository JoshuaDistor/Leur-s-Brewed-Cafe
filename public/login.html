<!DOCTYPE html>
<html lang="en"><head>
<title>Sign in - Leur's Brewed Cafe</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b271c">
<link rel="icon" type="image/jpeg" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<main class="auth-wrap"><div class="container auth-container">
  <div class="row g-4 align-items-stretch">
    <div class="col-lg-4"><div class="auth-brand">
      <img src="img/logo.jpg" alt="Leur's cafe logo">
      <div class="auth-brand-text">
        <h2 class="serif">Stay Fresh and take a Rest</h2>
        <div class="sub">Coffee Break</div>
      </div>
    </div></div>
    <div class="col-lg-8"><div class="cafe-card auth-panel">
      <h1>Welcome back</h1>
      <form id="form" novalidate>
        <div class="mb-3"><label class="form-label cafe" for="identifier">Email or username</label>
          <input class="form-control" id="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required></div>
        <div class="mb-4"><label class="form-label cafe" for="password">Password</label>
          <input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
        <div id="error" class="alert alert-danger py-2 small d-none" role="alert"></div>
        <button class="btn btn-caramel w-100 mt-3" id="submit" type="submit">SIGN IN</button>
        <p class="text-center small mt-3 text-secondary mb-0">New here? <a href="register.html">Create an account</a></p>
      </form>
    </div></div>
  </div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
const el = (id) => document.getElementById(id);
el('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = el('error'); err.classList.add('d-none');
  const who = el('identifier').value.trim();
  if (!who || !el('password').value) { err.textContent = 'Enter your email or username and password.'; err.classList.remove('d-none'); return; }
  el('submit').disabled = true;
  try {
    // the server accepts either the email address or the username
    const u = await API.post('/api/login', { identifier: who, password: el('password').value });
    location.href = u.role === 'admin' ? 'admin.html' : 'menu.html';
  } catch (ex) { err.textContent = ex.message; err.classList.remove('d-none'); el('submit').disabled = false; }
});
</script>
</body></html>
